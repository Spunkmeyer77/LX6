name: Build LX-6

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""
  release:
    types: [ published ]

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: echo "version=$(sed -n 's/^project(LX6 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> $GITHUB_OUTPUT

      - name: Configure (universal binary)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build AU, VST3 and app
        run: cmake --build build --target LX6_AU LX6_VST3 LX6_Standalone --parallel

      - name: Sign (ad-hoc)
        run: |
          A=build/LX6_artefacts/Release
          codesign --force --deep --sign - "$A/AU/LX-6.component"
          codesign --force --deep --sign - "$A/VST3/LX-6.vst3"
          codesign --force --deep --sign - "$A/Standalone/LX-6.app"

      - name: Validate (auval + pluginval)
        run: |
          set -o pipefail
          A=build/LX6_artefacts/Release
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$A/AU/LX-6.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aumu Lx6d TcRs 2>&1 | tee auval.log | tail -5 || { grep -E "FATAL|ERROR|FAIL" auval.log | head -10 | while IFS= read -r l; do echo "::error::auval: $l"; done; exit 1; }
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests "$A/VST3/LX-6.vst3" 2>&1 | tee pv.log | tail -5 || { grep -iE "fail|error|crash" pv.log | head -10 | while IFS= read -r l; do echo "::error::pluginval: $l"; done; exit 1; }

      - name: Build installer (.pkg)
        run: |
          set -e
          V=${{ steps.v.outputs.version }}
          A=build/LX6_artefacts/Release
          mkdir -p pkgroot/au pkgroot/vst3 pkgroot/app pkgs out
          cp -R "$A/AU/LX-6.component" pkgroot/au/
          cp -R "$A/VST3/LX-6.vst3" pkgroot/vst3/
          cp -R "$A/Standalone/LX-6.app" pkgroot/app/
          pkgbuild --root pkgroot/au   --identifier com.ticcoross.lx6.au   --version $V --install-location "/Library/Audio/Plug-Ins/Components" pkgs/au.pkg
          pkgbuild --root pkgroot/vst3 --identifier com.ticcoross.lx6.vst3 --version $V --install-location "/Library/Audio/Plug-Ins/VST3" pkgs/vst3.pkg
          pkgbuild --root pkgroot/app  --identifier com.ticcoross.lx6.app  --version $V --install-location "/Applications" pkgs/app.pkg
          sed "s/@VERSION@/$V/g" installer/distribution.xml > pkgs/distribution.xml
          productbuild --distribution pkgs/distribution.xml --resources installer/resources --package-path pkgs "out/LX-6-$V-macOS.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: LX-6-macOS
          path: out/*.pkg

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        shell: bash
        run: echo "version=$(sed -n 's/^project(LX6 VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> $GITHUB_OUTPUT

      - name: Configure (clang-cl)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -T ClangCL

      - name: Build VST3 and app
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --target LX6_VST3 LX6_Standalone --parallel 2>&1 | tee build.log || {
            grep -E "error|fatal" build.log | grep -v "warning" | sort -u | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DBuildDir=$pwd\build\LX6_artefacts\Release" "/O$pwd\out" installer\lx6.iss

      - uses: actions/upload-artifact@v4
        with:
          name: LX-6-Windows
          path: out/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [ macos, windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: LX-6 ${{ inputs.release_tag || github.ref_name }}
          body_path: docs/release-notes.md
          files: |
            dist/LX-6-macOS/*.pkg
            dist/LX-6-Windows/*.exe
            docs/LX-6_Manual.pdf
            docs/LX-6_Update_History.pdf
